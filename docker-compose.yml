version: '3.9'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: mistikai-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0
    deploy:
      resources:
        limits:
          memory: 4G

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mistikai-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - TEST_MODE=${TEST_MODE:-true}
      - IYZICO_API_KEY=${IYZICO_API_KEY:-}
      - IYZICO_SECRET_KEY=${IYZICO_SECRET_KEY:-}
      - IYZICO_BASE_URL=${IYZICO_BASE_URL:-https://sandbox-api.iyzipay.com}
    volumes:
      - backend_uploads:/app/uploads
      - backend_db:/app/data
    depends_on:
      - ollama

  website:
    build:
      context: ./website
      dockerfile: Dockerfile
    container_name: mistikai-website
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"

volumes:
  ollama_data:
  backend_uploads:
  backend_db:
